[workspace]
resolver = "2"
members = [
    "host",
    "abi-types",
    "sdk",
    "examples/fs-probe",
    "examples/hello-raw",
    "examples/ticker",
    "examples/git-status",
    "examples/notify-toast",
    "examples/resurrect",
    "examples/session_creator",
    "examples/cron",
    "examples/agents",
    "examples/mailbox",
    "examples/services-probe",
    "tools/index",
]
default-members = ["host"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# The staticlib is always built with the release profile (wasmtime is far too
# slow otherwise); keep debug info on so the tmux side stays debuggable.
[profile.release]
opt-level = 2
lto = "thin"
debug = true
# panic=unwind is deliberate: every pgh_* export catches unwinds (ffi_guard!)
# and poisons the plugin subsystem instead of killing the user's tmux server.
panic = "unwind"

# Release builds of the wasm plugins: no DWARF, symbols stripped. The
# workspace release profile keeps debug info for the host staticlib,
# which would make every plugin several megabytes larger than needed.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = false
strip = true
lto = "fat"
