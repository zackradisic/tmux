[package]
name = "plugin-host"
version.workspace = true
edition.workspace = true

[lib]
name = "plugin_host"
# rlib so integration tests (tests/) can link against the crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
tmux-plugin-abi = { path = "../abi-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact-pinned LTS line; all wasmtime API usage is confined to engine.rs and
# (later) abi.rs so version bumps stay a two-file change.
wasmtime = { version = "=36.0.12", default-features = false, features = ["runtime", "cranelift", "parallel-compilation", "cache", "std"] }
slab = "0.4.12"
blake3 = "1.8.5"
toml = "1.1.2"
base64 = "0.22"
crossbeam-channel = "0.5"
# The fs side runs an executor, not a thread doing one job at a time: a
# listing fans its per-entry stats out as tasks and awaits them, so the
# thread that submitted them is free to run those very tasks (or another
# plugin's job) instead of sitting in a blocking join. See fsworker.rs.
async-executor = "1"
async-channel = "2"
futures-lite = "2"
libc = "0.2"
# The per-plugin SQLite connection sits behind an async mutex: a
# statement task that finds it busy parks in the executor instead of
# holding a runner thread. See sqlite.rs.
async-lock = "3"
# Per-plugin SQLite database (db_* imports). Bundled: no system libsqlite3
# is assumed. `hooks` gives the authorizer and progress handler that make
# the SQL sandbox and the statement time cap; `limits` the ATTACH limit.
# All rusqlite usage is confined to sqlite.rs.
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
# Compress-on-write for ZSTD_REF blob parameters and `db_decompress`.
# Already built for wasmtime's cache feature; confined to sqlite.rs.
zstd = "0.13"

[dev-dependencies]
wat = "1"
# bench_fs.rs sleeps on the fs doorbell fd the way libevent does.
libc = "0.2"
