[package]
name = "slack"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tmux-plugin-sdk = { path = "../../sdk" }
listkit = { path = "../../listkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Slack desktop app's `d` cookie: AES-128-CBC under a PBKDF2-SHA1 key
# from the Keychain (what Chromium's "Safe Storage" does). Decrypted in
# the plugin so no helper process ever holds the secret. See auth.rs.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
