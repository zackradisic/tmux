# Reference capability sidecar for the agents plugin.
#
# Only consulted in restrictive mode, where it must sit next to the
# deployed agents.wasm as `agents.toml`. Effective caps = these requests
# intersected with the user's `load-plugin -c ...` grants. Under
# trust-the-user (no sidecar) every requested cap is granted, the
# env-read allowlist is unrestricted, and fs-read reaches anywhere.
#
# service-serve and service-call carry the roster across linked servers
# (the provider half answers list/capture/search/act and publishes
# `changed`; the view half calls and follows them). Without them the
# picker shows local agents only, and the log says
# "register list: capability service-serve not granted".
#
# claude-notify pushes a mailbox message into the Claude session that owns
# the box, over its inbox socket, so the agent wakes with it. Without it
# messages stay in the mailbox for `inbox`.

[caps]
requests = [
  "capture-pane",
  "run-command",
  "mode",
  "db",
  "env-read",
  "pane-fds",
  "fs-read",
  "fs-list",
  "service-serve",
  "service-call",
  "claude-notify",
  # The picker's interrupt key: one C-c into the agent's pane. For a
  # remote agent the key goes to its shadow pane, whose fd is one end of
  # the link's socketpair, so it reaches the real agent. Killing a pane
  # needs nothing extra - that goes through run-command.
  "send-keys",
]

# The services this plugin calls: its own provider on any server, and the
# mailbox plugin (for the picker's message send and unread badge).
[caps.services]
call = ["agents@*", "mailbox@*"]

# The only environment variables the roster ever reads. Everything else
# in a pane's environment (tokens, secrets) stays unreadable. Used only
# for detection fallback; identity comes from the harness session files.
# `_` is the launched program path: an interpreter-wrapped CLI (codex runs
# as `node /usr/bin/codex`) is detected by the basename of `_`.
[caps.env-read]
names = [
  "AI_AGENT",
  "OPENCODE",
  "_",
]

# The only directories the roster ever reads. fs-read stays sandboxed
# except under these prefixes, so the plugin reaches the harness session
# files WITHOUT the blanket fs-read-any grant. `~` expands to the server
# user's home.
[caps.fs-read]
paths = [
  "~/.claude/sessions",
  "~/.codex/sessions",
  "~/.pi",
  "~/.local/share/opencode",
]
