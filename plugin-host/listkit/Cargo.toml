[package]
name = "listkit"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
tmux-plugin-sdk = { path = "../sdk" }
# Column widths for the cell model (wide and emoji glyphs); no CJK
# ambiguity handling, the terminal does not have it either.
unicode-width = { version = "0.2", default-features = false }
